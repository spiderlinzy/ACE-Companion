<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Compliance Engineering · AI 合规工程</title>
  <meta name="description" content="AI Compliance Engineering open methodology handbook: regulation-to-evidence translation, engineering controls and verification. 从监管到证据的 AI 合规工程公开方法手册。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231d4ed8' d='M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z'/%3E%3Cpath fill='%23fff' d='M10.8 14.6 8.2 12l-1.4 1.4 4 4 6.6-6.6L16 9.4z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/vendor/buble.css" />
  <style>
    :root { --theme-color: #16305e; --accent: #c9a86a; }
    .app-name-link img { max-width: 160px; }
    .sidebar { background: #0b1f3a; color: #d7e0ee; }
    .sidebar > h1 a { color: #f2efe6 !important; font-weight: 700; }
    .sidebar-nav li a { color: #c4d0e2; font-size: 14px; }
    .sidebar-nav li a:hover { color: #ffffff; }
    .sidebar-nav li.active > a { color: var(--accent) !important; border-right: 2px solid var(--accent); }
    .markdown-section { max-width: 860px; }
    .markdown-section h1 { color: var(--theme-color); border-bottom: 2px solid var(--accent); padding-bottom: .3em; }
    .markdown-section h2 { color: var(--theme-color); margin-top: 1.8em; }
    .markdown-section table { display: table; width: 100%; font-size: 14px; }
    .markdown-section blockquote { border-left-color: var(--accent); background: #f7f4ec; color: #4a4a4a; }
    .hero { background: linear-gradient(135deg,#10244a 0%,#0b1f3a 100%); color: #f2efe6; border-radius: 14px; padding: 34px 30px; margin: 18px 0 26px; }
    .hero h1 { color: #f2efe6 !important; border: none !important; margin: 0 0 10px; font-size: 30px; }
    .hero .sub { color: #c4d0e2; font-size: 16px; line-height: 1.7; }
    .hero .en { color: #8fa3c4; font-size: 13px; margin-top: 8px; }
    .badges span { display: inline-block; background: rgba(201,168,106,.16); color: #e6d3a8; border: 1px solid rgba(201,168,106,.5); border-radius: 999px; padding: 3px 12px; font-size: 12px; margin: 10px 8px 0 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px; margin: 18px 0; }
    .card { border: 1px solid #e3e8f0; border-radius: 10px; padding: 16px 18px; background: #fbfcfe; }
    .card h4 { margin: 0 0 8px; color: var(--theme-color); }
    .card p { margin: 0; font-size: 13.5px; color: #44506a; line-height: 1.65; }
    .book-cta { background: #f7f4ec; border: 1px solid #e6dcc2; border-radius: 12px; padding: 18px 22px; margin: 22px 0; }
    .book-cta a.btn { display: inline-block; background: var(--theme-color); color: #fff !important; padding: 9px 20px; border-radius: 8px; text-decoration: none; margin-top: 8px; }
    .anchor span { color: var(--theme-color); }
    .side-lang { color: #c9a86a !important; text-decoration: none; font-size: 13px; line-height: 1.9; }
    .side-back { color: #c9a86a !important; text-decoration: none; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>
  <script>
    window.$docsify = {
      name: 'AI 合规工程',
      repo: '',
      loadSidebar: true,
      alias: {
        '/en/.*/_sidebar.md': '/en/_sidebar.md',
        '/en/_sidebar.md': '/en/_sidebar.md',
        '/(?!en/).*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      homepage: 'README.md',
      basePath: location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1),
      search: {
        placeholder: {
          '/en/': 'Search regulations, controls, terms…',
          '/': '搜索法规、控制措施、术语…'
        },
        noData: {
          '/en/': 'No matches',
          '/': '没有匹配结果'
        },
        depth: 3
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var isEn = location.hash.indexOf('#/en') === 0;
            document.documentElement.lang = isEn ? 'en' : 'zh-CN';
            var appName = document.querySelector('.app-name-link');
            if (appName) appName.textContent = isEn ? 'AI Compliance Engineering' : 'AI 合规工程';
            try { localStorage.setItem('ace-lang', isEn ? 'en' : 'zh'); } catch (e) {}
          });
        },
        function (hook) {
          hook.mounted(function () {
            function pruneResults() {
              var panel = document.querySelector('.results-panel');
              if (!panel) return;
              var isEn = location.hash.indexOf('#/en') === 0;
              var links = panel.querySelectorAll('a');
              for (var i = 0; i < links.length; i++) {
                var path = (links[i].getAttribute('href') || '').split('?')[0];
                var keep = false;
                if (isEn) {
                  keep = (path === '#/en/' || path === '#/en' || path === '#/en/README' || path.indexOf('#/en/docs/') === 0);
                } else {
                  keep = (path === '#/' || path === '#/README' || path.indexOf('#/docs/') === 0);
                }
                links[i].style.display = keep ? '' : 'none';
              }
            }
            var timer = null;
            document.addEventListener('input', function (e) {
              if (e.target && e.target.className && String(e.target.className).indexOf('search') >= 0) {
                clearTimeout(timer);
                timer = setTimeout(pruneResults, 350);
              }
            }, true);
            var obs = new MutationObserver(function () { pruneResults(); });
            obs.observe(document.body, { childList: true, subtree: true });
          });
        }
      ]
    };
  </script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
</body>
</html>
